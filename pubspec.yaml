name: bluecoins
description: "Track your money with one balance a day. Private, offline-first, free."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

# Host tests on this Linux box load the system SQLite (bundled one needs newer glibc).
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
      name:
        linux: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0

flutter:
  uses-material-design: true
